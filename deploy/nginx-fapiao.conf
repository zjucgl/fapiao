# /etc/nginx/sites-available/fapiao.conf
# fapiao：Vue SPA 静态资源 + /api/* 反代到 NestJS 进程

# 80: ACME 续期 + 强制跳转 HTTPS
server {
  listen 80;
  server_name fp.app.huayihui.art;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# 443: SPA + API 反代
server {
  listen 443 ssl http2;
  server_name fp.app.huayihui.art;

  ssl_certificate     /etc/letsencrypt/live/fp.app.huayihui.art/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fp.app.huayihui.art/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  client_max_body_size 30m;

  access_log /var/log/nginx/fapiao.access.log;
  error_log  /var/log/nginx/fapiao.error.log;

  root /opt/fapiao/web;
  index index.html;

  # /api 反代后端
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # 静态资源缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback：其他都打到 index.html，让 vue-router 接管
  location / {
    try_files $uri $uri/ /index.html;
  }
}
